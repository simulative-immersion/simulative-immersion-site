# Build static site and deploy to GitHub Pages.
# Repo settings → Pages → Build and deployment → Source: GitHub Actions.
#
# Base URL for Vite assets:
# - Default (no variable): /simulative-immersion-site/ → matches https://<org>.github.io/<repo>/
# - Custom domain at site root (e.g. https://example.com/): set repo variable VITE_BASE_PATH to /
#   (Settings → Secrets and variables → Actions → Variables)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build
        env:
          # Custom root domain → set Actions variable VITE_BASE_PATH to /
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH != '' && vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
